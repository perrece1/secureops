apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: secure-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-read-role
  namespace: secure-apps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-read-binding
  namespace: secure-apps
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: secure-apps
roleRef:
  kind: Role
  name: app-read-role
  apiGroup: rbac.authorization.k8s.io
